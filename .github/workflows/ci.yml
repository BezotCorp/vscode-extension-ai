name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  ci-control:
    name: CI control (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare and verify
        uses: ./.github/actions/verify

      - name: Package extension
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: pnpm run package --target ${{ matrix.target }}
